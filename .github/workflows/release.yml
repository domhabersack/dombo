name: Release packages

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: npm exchanges this OIDC token for a short-lived
  # publish token, so no NPM_TOKEN secret is needed. Provenance is automatic.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Opens a "Version packages" PR while changesets are pending; publishes once it's merged.
      # Without NPM_TOKEN set, the action leaves npm auth to trusted publishing.
      - uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
